<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#0d0d0d;color:#fff}
.stripe{position:absolute;left:0;right:0;height:70px;background:repeating-linear-gradient(-45deg,#ffd400 0 40px,#0d0d0d 40px 80px)}
.top{top:0}.bot{bottom:120px}
.tag{position:absolute;top:120px;left:50%;transform:translateX(-50%);background:#e10600;color:#fff;font-weight:900;font-size:36px;letter-spacing:6px;padding:14px 40px;border-radius:8px;white-space:nowrap;box-shadow:0 0 60px rgba(225,6,0,.7)}
.tag:before{content:"⚠ ";}
h1{position:absolute;top:240px;left:70px;right:70px;font-size:118px;text-align:center}
h1 .y{color:#ffd400}
h1 .r{color:#fff;background:#e10600;padding:0 14px;display:inline-block;transform:rotate(-2deg)}
.sub{position:absolute;top:800px;left:90px;right:90px;text-align:center;font-size:38px;font-weight:600;line-height:1.35;color:#ddd}
.sub b{color:#ffd400;font-weight:900}
.ctaw{position:absolute;top:1015px;left:0;right:0;text-align:center}
.cta{background:#ffd400;color:#0d0d0d}
.brand{background:#0d0d0d;color:#fff}.brand .sep{background:#ffd400}
.brand .ar{color:#ffd400}
</style></head><body>
<div class="stripe top"></div>
<div class="tag">ATENÇÃO, EMPRESÁRIO</div>
<h1 class="anton">Sua empresa pode estar pagando <span class="y">juros</span> que <span class="r">nem deveria</span> pagar</h1>
<p class="sub">Capital de giro, cheque especial e cartão PJ costumam esconder <b>encargos abusivos</b>. Descubra antes de renegociar com o banco.</p>
<div class="ctaw"><span class="cta">Quero analisar minha dívida <span class="arr">→</span></span></div>
<div class="stripe bot"></div>
<div class="brand"><span class="nm">DRA. CLAUDIA FERREIRA</span><span class="sep"></span><span class="ar">Gestão de Passivo PJ</span></div>
</body></html>
