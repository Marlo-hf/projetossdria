<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GA02 · Andiara · Empréstimo pra pagar empréstimo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #111; }
  body.f916, body.f916 html { height: 1920px; }
  body { font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .canvas {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: url(img/andiara.jpg) center -310px / 1080px 1920px no-repeat;
  }
  body.f916 .canvas { height: 1920px; background-position: center 0; }
  .canvas::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 640px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.5) 50%, rgba(0,0,0,.8) 100%);
  }
  .canvas > * { position: absolute; z-index: 2; }

  .tag {
    left: 70px; top: 64px;
    background: rgba(0,0,0,.62); color: #fff;
    font-size: 25px; font-weight: 700; letter-spacing: .02em;
    padding: 12px 20px; border-radius: 10px;
  }
  .tag b { color: #F1D27F; }

  .head { left: 64px; right: 50px; top: 715px; transform: rotate(-1.5deg); }
  .head p { font-size: 58px; line-height: 1.36; font-weight: 800; letter-spacing: -0.025em; }
  .head span {
    background: #E9C46A; color: #111;
    padding: 2px 18px 8px; border-radius: 12px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .punch { left: 64px; right: 50px; top: 920px; transform: rotate(-1.5deg); }
  .punch p { font-size: 46px; line-height: 1.42; font-weight: 800; letter-spacing: -0.02em; }
  .punch span {
    background: #fff; color: #111;
    padding: 3px 16px 7px; border-radius: 12px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  .rodape {
    left: 70px; right: 70px; bottom: 54px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
  }
  .rodape .cta { color: #fff; font-size: 27px; line-height: 1.32; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .rodape .cta b { font-weight: 800; color: #F1D27F; }
  .logo { width: 300px; flex: none; margin-bottom: 4px; }

  /* 9:16 */
  body.f916 .tag { top: 250px; }
  body.f916 .head { top: 1030px; }
  body.f916 .punch { top: 1240px; }
  body.f916 .rodape { bottom: 330px; }
  body.f916 .canvas::after { height: 1050px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="tag">Dívida da empresa no banco acima de <b>R$ 100 mil</b></div>

  <div class="head">
    <p><span>Pegou empréstimo novo</span></p>
    <p><span>pra pagar o antigo?</span></p>
  </div>

  <div class="punch">
    <p><span>Agora são duas parcelas.</span></p>
    <p><span>E o caixa é o mesmo.</span></p>
  </div>

  <div class="rodape">
    <p class="cta">Antes de assinar o terceiro,<br><b>fala com a gente.</b><br>Preencha o formulário.</p>
    <img class="logo" src="img/logo-schemes-remonti.png" alt="Schemes & Remonti Advogados Associados">
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('f') === '916') document.body.classList.add('f916');
</script>
</body>
</html>
