<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bordo — Gestão de Clientes</title>
  <meta name="description" content="Gestão de clientes, tarefas e diário de bordo em um só lugar.">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8h-7m7 0h1a4 4 0 0 1 0 8' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' transform='translate(0 -2)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
    <div class="scrim" data-action="close-sidebar"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" data-action="open-sidebar" aria-label="Abrir menu">☰</button>
        <nav class="crumbs" id="crumbs"></nav>
        <button class="search-trigger" data-action="palette" aria-label="Buscar">
          <span>🔍</span><span class="grow">Buscar clientes, tarefas, diário…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="btn btn-ghost hide-sm" data-action="new-log" title="Novo registro no diário (D)">📓 Registrar</button>
          <button class="btn btn-primary" data-action="new-task" title="Nova tarefa (N)">＋ <span class="hide-sm">Tarefa</span></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
