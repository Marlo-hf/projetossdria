<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>.card{width:100%;border-radius:36px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);padding:40px 44px;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;gap:18px;font-size:24px;color:var(--mute);font-weight:600}
.bk{width:54px;height:54px;border-radius:14px;background:#1f1f24;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1)}
.msg{font-size:34px;line-height:1.35;margin-top:22px;font-weight:500;color:#e9e4da}
.stamp{position:absolute;right:34px;top:-34px;border:5px solid var(--red);color:var(--red);font-weight:900;font-size:40px;letter-spacing:5px;padding:8px 26px;border-radius:14px;transform:rotate(8deg);background:rgba(11,11,13,.85)}
.turn{margin-top:30px;font-family:"Playfair Display",serif;font-size:46px;font-weight:800;line-height:1.15;text-align:center}
.turn em{font-style:italic;color:var(--gold)}</style></head><body><div class="frame"></div><div class="wrap">
 <div class="kicker">Golpe do Pix</div>
 <h1>Caiu em um <em>golpe do Pix</em> de mais de R$&nbsp;10&nbsp;mil?</h1>
 <div class="stage"><div style="width:100%">
  <div class="card"><div class="stamp">NEGADO</div>
   <div class="row"><div class="bk"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e3bf72" stroke-width="2"><path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg></div>Resposta do banco</div>
   <div class="msg">“A transação foi autorizada pelo titular. Não é possível devolver o valor.”</div>
  </div>
  <div class="turn">O banco negou? <em>Isso não é o fim.</em></div>
 </div></div>
 <div class="cta">Preencha o formulário <svg viewBox="0 0 24 24" fill="none" stroke="#1a1408" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><div class="foot"><span><i></i>Leva menos de 1 minuto</span><span><i></i>Atendimento 100% online</span></div>
</div></body></html>
