<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estáticos Schemes & Remonti</title>
<style>
  @font-face { font-family: M; font-weight: 700; src: url(assets/montserrat-700.woff2); }
  @font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-800.woff2); }
  @font-face { font-family: M; font-weight: 900; src: url(assets/montserrat-900.woff2); }
  @font-face { font-family: I; font-weight: 400; src: url(assets/inter-400.woff2); }
  @font-face { font-family: I; font-weight: 500; src: url(assets/inter-500.woff2); }
  @font-face { font-family: I; font-weight: 600; src: url(assets/inter-600.woff2); }
  @font-face { font-family: I; font-weight: 700; src: url(assets/inter-700.woff2); }
  @font-face { font-family: Hand; font-weight: 700; src: url(assets/caveat-700.woff2); }

  :root {
    --navy: #0b1a2b; --navy-2: #13263b; --gold: #ffc93c; --gold-soft: #ffe1a4;
    --red: #e02424; --ink: #0b1a2b; --paper: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; }
  .canvas { width: 1080px; height: 1350px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .canvas.story { height: 1920px; }
  .story .frame { height: 1440px; }
  .story .doc { margin-top: 70px; }
  .story .lawyer { margin-top: 120px; }
  .frame { width: 1080px; height: 1350px; position: relative; padding: 70px 72px 56px; display: flex; flex-direction: column; }

  .pill {
    align-self: flex-start; font-family: I; font-weight: 700; font-size: 22px; letter-spacing: .6px;
    padding: 12px 22px; border-radius: 40px; text-transform: uppercase;
  }
  h1 { font-family: M; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; line-height: 1.02; margin-top: 28px; }
  .cta {
    margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 16px;
    font-family: M; font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: .2px;
    height: 104px; flex: none; border-radius: 60px;
  }
  .foot { margin-top: 22px; text-align: center; font-family: I; font-weight: 600; font-size: 19px; }

  /* ============ GREGORY: navy + chat ============ */
  .gregory { background: var(--navy); color: #fff; }
  .gregory .pill { background: var(--gold); color: var(--navy); }
  .gregory h1 { font-size: 84px; }
  .gregory h1 em { font-style: normal; color: var(--gold); }

  .phone {
    margin: 40px auto 0; width: 820px; flex: 1 1 auto; min-height: 0;
    background: #0e0e0e; border-radius: 56px 56px 0 0; padding: 18px 18px 0;
    box-shadow: 0 -10px 60px rgba(255,201,60,.12);
    display: flex; flex-direction: column;
  }
  .screen { flex: 1; background: #efe7dd; border-radius: 40px 40px 0 0; overflow: hidden; display: flex; flex-direction: column; }
  .chat-head { background: #1f5c4f; color: #fff; display: flex; align-items: center; gap: 18px; padding: 22px 28px; }
  .chat-head .av { width: 74px; height: 74px; border-radius: 50%; background: center 18%/cover; border: 3px solid rgba(255,255,255,.25); }
  .chat-head b { display: block; font-family: I; font-weight: 700; font-size: 29px; }
  .chat-head small { font-family: I; font-weight: 500; font-size: 20px; opacity: .85; }
  .msgs { padding: 26px 26px 0; display: flex; flex-direction: column; gap: 16px; }
  .b {
    max-width: 82%; font-family: I; font-weight: 500; font-size: 27px; line-height: 1.32; color: #111;
    padding: 16px 22px 30px; border-radius: 18px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.08);
  }
  .b .t { position: absolute; right: 16px; bottom: 8px; font-size: 16px; color: #667; font-weight: 500; }
  .me { align-self: flex-end; background: #d6f5c3; border-top-right-radius: 4px; }
  .me .t::after { content: " ✓✓"; color: #34b7f1; }
  .adv { align-self: flex-start; background: #fff; border-top-left-radius: 4px; }
  .adv strong, .me b { font-weight: 700; }
  .typing { align-self: flex-start; background: #fff; border-radius: 18px; padding: 18px 22px; display: flex; gap: 8px; }
  .typing i { width: 12px; height: 12px; border-radius: 50%; background: #9aa; }
  .gregory .sub { margin-top: 30px; text-align: center; font-family: I; font-size: 30px; font-weight: 500; color: #d9e2ec; line-height: 1.35; }
  .gregory .sub b { color: #fff; font-weight: 700; }
  .gregory .cta { background: var(--gold); color: var(--navy); margin-top: 26px; box-shadow: 0 14px 40px rgba(255,201,60,.25); }
  .gregory .foot { color: #8fa3b8; }

  /* ============ ANDIARA: amarelo + proposta do banco ============ */
  .andiara { background: var(--gold); color: var(--ink); }
  .andiara .pill { background: var(--navy); color: var(--gold); }
  .andiara h1 { font-size: 82px; }
  .doc {
    position: relative; margin: 46px auto 0; width: 860px; background: var(--paper);
    border-radius: 14px; padding: 36px 44px 34px; transform: rotate(-2deg);
    box-shadow: 0 30px 60px rgba(11,26,43,.28), 0 2px 0 rgba(0,0,0,.05);
    font-family: I; color: #1d2633;
  }
  .doc .hd { display: flex; flex-direction: column; gap: 6px; border-bottom: 2px solid #1d2633; padding-bottom: 14px; }
  .doc .hd b { font-weight: 700; font-size: 31px; letter-spacing: .5px; }
  .doc .hd span { font-size: 19px; color: #6b7684; font-weight: 500; }
  .row { display: flex; justify-content: space-between; font-size: 26px; padding: 15px 0; border-bottom: 1px dashed #c9d0d8; }
  .row span { color: #5a6573; font-weight: 500; }
  .row b { font-weight: 700; }
  .row.total { border-bottom: 0; padding-top: 20px; font-size: 31px; }
  .row.total b { color: var(--red); position: relative; }
  .row.total b svg { position: absolute; left: -38px; top: -20px; width: calc(100% + 76px); height: calc(100% + 40px); overflow: visible; }
  .sign { margin-top: 18px; display: flex; align-items: flex-end; gap: 16px; font-size: 19px; color: #6b7684; }
  .sign .line { flex: 1; border-bottom: 2px solid #1d2633; height: 34px; }
  .note {
    position: absolute; right: -10px; bottom: -64px; transform: rotate(4deg);
    font-family: Hand; font-weight: 700; font-size: 52px; color: var(--red); white-space: nowrap;
  }
  .note::before { content: "↑"; margin-right: 8px; }
  .lawyer {
    margin-top: 88px; flex: none; display: flex; align-items: center; gap: 24px;
    background: var(--navy); color: #fff; border-radius: 26px; padding: 22px 30px 22px 22px;
  }
  .lawyer .av { flex: none; width: 116px; height: 116px; border-radius: 50%; background: center 22%/cover; box-shadow: 0 0 0 4px var(--gold); }
  .lawyer p { font-family: I; font-size: 27px; line-height: 1.3; font-weight: 500; color: #dde5ee; }
  .lawyer p b { color: var(--gold); font-weight: 700; }
  .lawyer small { display: block; margin-top: 4px; font-family: I; font-size: 19px; color: #8fa3b8; font-weight: 600; }
  .andiara .cta { background: var(--navy); color: var(--gold); margin-top: 28px; }
  .andiara .foot { color: rgba(11,26,43,.7); }

  .brandline { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .brandline img { width: 30px; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="frame" id="frame"></div>
</div>

<template id="t-gregory">
  <div class="pill">Gestão de passivo empresarial</div>
  <h1>Deve mais de<br><em>R$ 100 mil</em><br>ao banco?</h1>
  <div class="phone">
    <div class="screen">
      <div class="chat-head">
        <div class="av" style="background-image:url(assets/gregory.jpg)"></div>
        <div><b>Dr. Gregory Remonti</b><small>Schemes &amp; Remonti · online</small></div>
      </div>
      <div class="msgs">
        <div class="b me">Doutor, a empresa deve <b>R$ 380 mil</b> pro banco e o gerente quer que eu assine um novo acordo até sexta.<span class="t">09:12</span></div>
        <div class="b adv"><strong>Não assine nada ainda.</strong> Me envie os contratos que eu analiso o seu caso pessoalmente.<span class="t">09:14</span></div>
        <div class="typing"><i></i><i></i><i></i></div>
      </div>
    </div>
  </div>
  <p class="sub">Antes de decidir, <b>fale direto com o advogado</b><br>que vai cuidar da sua empresa.</p>
  <div class="cta">Falar com o Dr. Gregory →</div>
  <div class="foot brandline"><img src="assets/logo.svg" alt="">Schemes &amp; Remonti Advogados · OAB/RS 128.236 · imagem ilustrativa</div>
</template>

<template id="t-andiara">
  <div class="pill">Dívida bancária acima de R$ 100 mil</div>
  <h1>O banco te<br>mandou isso<br>pra assinar?</h1>
  <div class="doc">
    <div class="hd"><b>PROPOSTA DE RENEGOCIAÇÃO</b><span>Banco S.A. · Cliente: Sua Empresa Ltda.</span></div>
    <div class="row"><span>Saldo devedor atual</span><b>R$ 412.380,00</b></div>
    <div class="row"><span>Novo prazo</span><b>60 parcelas de R$ 14.920,00</b></div>
    <div class="row"><span>Garantia</span><b>Aval dos sócios + imóvel</b></div>
    <div class="row total"><span>Total a pagar</span><b>R$ 895.200,00<svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M6 22 C 4 6, 60 2, 92 10 C 102 14, 98 34, 60 37 C 30 40, 2 34, 4 20" fill="none" stroke="#e02424" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:5px"/></svg></b></div>
    <div class="sign"><span>Assinatura do cliente</span><div class="line"></div></div>
    <div class="note">mais que o dobro!</div>
  </div>
  <div class="lawyer">
    <div class="av" style="background-image:url(assets/andiara.jpg)"></div>
    <div><p>Antes de assinar, mostre para<br>a <b>Dra. Andiara Schemes</b>.</p><small>OAB/RS 91.691 · sócia da Schemes &amp; Remonti</small></div>
  </div>
  <div class="cta">Falar com a Dra. Andiara →</div>
  <div class="foot brandline">Gestão de passivo empresarial · valores ilustrativos</div>
</template>

<script>
  const q = new URLSearchParams(location.search);
  const p = q.get("p") || "gregory";
  const c = document.getElementById("canvas"), f = document.getElementById("frame");
  c.classList.add(p); if (q.get("f") === "story") c.classList.add("story");
  f.appendChild(document.getElementById("t-" + p).content.cloneNode(true));
  document.fonts.ready.then(() => document.body.dataset.ready = 1);
</script>
</body>
</html>
