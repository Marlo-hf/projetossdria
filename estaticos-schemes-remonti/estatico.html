<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Estáticos Schemes & Remonti</title>
<style>
  @font-face { font-family: Anton; src: url(assets/anton-400.woff2); }
  @font-face { font-family: M; font-weight: 700; src: url(assets/montserrat-700.woff2); }
  @font-face { font-family: M; font-weight: 800; src: url(assets/montserrat-800.woff2); }
  @font-face { font-family: M; font-weight: 900; src: url(assets/montserrat-900.woff2); }
  @font-face { font-family: I; font-weight: 500; src: url(assets/inter-500.woff2); }
  @font-face { font-family: I; font-weight: 600; src: url(assets/inter-600.woff2); }
  @font-face { font-family: I; font-weight: 700; src: url(assets/inter-700.woff2); }

  :root { --gold: #f0c877; --gold-hi: #ffe1a4; --navy: #07111c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; }

  .ad { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; background: var(--navy); }
  .ad.story { height: 1920px; }

  /* foto + tratamento de cor */
  .photo { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; filter: contrast(1.08) saturate(.9); }
  .shade { position: absolute; inset: 0; }
  .grain {
    position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 78px 76px 64px; }
  .story .content { padding: 220px 76px 320px; }

  .kicker {
    display: flex; align-items: center; gap: 16px;
    font-family: M; font-weight: 800; font-size: 23px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold);
  }
  .kicker::before { content: ""; width: 54px; height: 3px; background: var(--gold); }

  h1 {
    margin-top: 24px; font-family: Anton; font-weight: 400; text-transform: uppercase;
    font-size: 108px; line-height: 1.0; letter-spacing: .5px;
    text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  .story h1 { font-size: 108px; margin-top: 28px; }
  .story .sub br { display: none; }
  .story .sub b::before { content: ' '; }
  .story .shade::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(7,17,28,.75) 62%, rgba(7,17,28,.95) 75%); }
  h1 .g { color: var(--gold); }
  h1 .band {
    display: inline-block; margin-top: 14px; padding: 6px 22px 2px;
    background: var(--gold); color: var(--navy); text-shadow: none;
    transform: rotate(-1.5deg); transform-origin: left center; white-space: nowrap;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }

  .bottom { margin-top: auto; }
  .sub {
    font-family: I; font-weight: 500; font-size: 29px; line-height: 1.38; color: rgba(255,255,255,.88);
    max-width: 860px; text-shadow: 0 2px 16px rgba(0,0,0,.6);
  }
  .sub b { color: #fff; font-weight: 700; }
  .story .sub { font-size: 32px; }

  .cta {
    margin-top: 34px; display: inline-flex; align-items: center; gap: 22px;
    background: #fff; color: var(--navy); border-radius: 100px; padding: 14px 14px 14px 38px;
    font-family: M; font-weight: 800; font-size: 27px; letter-spacing: .4px; text-transform: uppercase;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .cta .go { width: 66px; height: 66px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; }
  .cta .go svg { width: 30px; height: 30px; }
  .story .cta { font-size: 29px; }

  .sign { margin-top: 40px; display: flex; align-items: center; gap: 16px; opacity: .95; }
  .sign img { width: 46px; }
  .sign b { display: block; font-family: M; font-weight: 700; font-size: 22px; letter-spacing: .3px; }
  .sign small { display: block; font-family: I; font-weight: 600; font-size: 13.5px; letter-spacing: 3.6px; color: var(--gold); margin-top: 2px; }

  /* ===== cena 1: empresário no escritório à noite ===== */
  .s1 .photo { background-image: url(assets/foto-empresario.png); background-position: center 50%; }
  .s1.story .photo { background-size: auto 2112px; background-position: center 0%; }
  .s1 .shade {
    background:
      linear-gradient(180deg, rgba(7,17,28,.9) 0%, rgba(7,17,28,.45) 26%, rgba(7,17,28,0) 40%, rgba(7,17,28,0) 62%, rgba(7,17,28,.8) 78%, rgba(7,17,28,.97) 100%),
      radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
  }

  /* ===== cena 2: mão prestes a assinar ===== */
  .s2 .photo { background-image: url(assets/foto-assinatura.png); background-position: center 22%; }
  .s2.story .photo { background-size: auto 2050px; background-position: center 0%; }
  .s2 .shade {
    background:
      linear-gradient(180deg, rgba(7,17,28,.88) 0%, rgba(7,17,28,.4) 26%, rgba(7,17,28,0) 40%, rgba(7,17,28,0) 62%, rgba(7,17,28,.8) 78%, rgba(7,17,28,.97) 100%),
      radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
  }
</style>
</head>
<body>
<div class="ad" id="ad">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="grain"></div>
  <div class="content" id="content"></div>
</div>

<template id="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#07111c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></template>

<script>
const ADS = {
  gregory: {
    scene: "s1",
    kicker: "Empresário com dívida no banco",
    h1: 'A dívida passou<br>de <span class="g">R$ 100 mil?</span><br><span class="band">Hora do advogado.</span>',
    sub: 'Renegociar sozinho só alonga o prazo e aumenta o custo.<br><b>Coloque seus contratos na mão de quem defende empresas.</b>',
    cta: "Preencha o formulário"
  },
  andiara: {
    scene: "s2",
    kicker: "Dívida bancária acima de R$ 100 mil",
    h1: 'O banco te deu<br>prazo pra assinar?<br><span class="band">Não assine sozinho.</span>',
    sub: 'É no contrato que se decide quanto a sua empresa vai pagar.<br><b>Passe por uma análise jurídica antes de qualquer acordo.</b>',
    cta: "Preencha o formulário"
  }
};
const q = new URLSearchParams(location.search);
const a = ADS[q.get("p") || "gregory"];
const ad = document.getElementById("ad");
ad.classList.add(a.scene); if (q.get("f") === "story") ad.classList.add("story");
document.getElementById("content").innerHTML = `
  <div class="kicker">${a.kicker}</div>
  <h1>${a.h1}</h1>
  <div class="bottom">
    <p class="sub">${a.sub}</p>
    <div class="cta">${a.cta}<span class="go">${document.getElementById("arrow").innerHTML}</span></div>
    <div class="sign"><img src="assets/logo.svg" alt=""><div><b>Schemes &amp; Remonti</b><small>ADVOGADOS ASSOCIADOS</small></div></div>
  </div>`;
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(()=>{}))]).then(() => setTimeout(() => document.body.dataset.ready = 1, 300));
</script>
</body>
</html>
